[package]
name = "l2split"
version = "0.1.1"
edition = "2021"
description = "Pick any app — send it straight out the Ethernet, bypassing the VPN. An alternative split tunneling (per-app, layer 2)."
license = "MIT"

[dependencies]
ipnetwork = "0.21.1"
winreg = "0.55"
tauri = { version = "2", features = ["devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
png = "0.17"
ndisapi = "0.7"

[dependencies.windows]
version = "0.62.2"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_IO",
    "Win32_Storage_FileSystem",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_NetworkManagement_IpHelper",
    "Win32_System_SystemInformation",
    "Win32_System_ProcessStatus",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[[bin]]
name = "l2split"
path = "src/main.rs"
